[params.home.profile]
  enable = true
  gravatarEmail = ""
  avatarURL = ""
  title = "Jason B. Hill"
  subtitle = "Welcome to my personal website"
  typeit = true
  social = true
  disclaimer = ""

# Home page posts - disable to not show posts on home page
[params.home.posts]
